services:
  - type: web
    name: smart-water-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: HARDWARE_MODE
        value: simulation
      - key: SECRET_KEY
        generateValue: true
